<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oral Disease Classifier</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: #fde2f7 url("/static/image.jpeg") center / cover fixed;
  }
  .card {
    width: min(92vw, 460px); padding: 28px; border-radius: 20px;
    background: rgba(255,255,255,.93); box-shadow: 0 10px 40px rgba(0,0,0,.15); text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 18px; }
  .drop {
    display: block; border: 2px dashed #d36bb5; border-radius: 14px; padding: 22px;
    cursor: pointer; color: #a0408a;
  }
  .drop:hover { background: #fff0fb; }
  #preview { max-width: 100%; max-height: 260px; border-radius: 12px; margin-top: 16px; display: none; }
  button {
    margin-top: 16px; padding: 11px 28px; border: 0; border-radius: 10px;
    background: #c2409f; color: #fff; font-size: 16px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #result { margin-top: 20px; display: none; }
  .top { font-size: 24px; font-weight: 700; color: #8a1f6f; }
  .conf { font-size: 18px; margin: 4px 0 14px; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
  .row .name { width: 130px; text-align: left; }
  .bar { flex: 1; height: 10px; background: #eee; border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: #d36bb5; }
  .warn { color: #b45309; font-size: 14px; margin-bottom: 8px; }
  .disc { margin-top: 16px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<div class="card">
  <h1>🦷 Oral Disease Classifier</h1>
  <div class="sub">Upload an image to see the predicted class and confidence</div>

  <label class="drop" id="drop">
    Click to choose an image or drag it here
    <input type="file" id="file" accept="image/png,image/jpeg" hidden>
  </label>
  <img id="preview" alt="">
  <br>
  <button id="btn" disabled>Analyze Image</button>

  <div id="result">
    <div id="warn" class="warn"></div>
    <div class="top" id="label"></div>
    <div class="conf" id="conf"></div>
    <div id="bars"></div>
  </div>

  <div class="disc">For educational purposes only. Not a medical diagnosis. Please consult a dentist.</div>
</div>

<script>
const file = document.getElementById("file"), drop = document.getElementById("drop"),
      preview = document.getElementById("preview"), btn = document.getElementById("btn"),
      result = document.getElementById("result");
let chosen = null;

function setFile(f) {
  if (!f) return;
  chosen = f;
  preview.src = URL.createObjectURL(f);
  preview.style.display = "block";
  btn.disabled = false;
  result.style.display = "none";
}
file.onchange = e => setFile(e.target.files[0]);
drop.ondragover = e => e.preventDefault();
drop.ondrop = e => { e.preventDefault(); setFile(e.dataTransfer.files[0]); };

btn.onclick = async () => {
  btn.disabled = true; btn.textContent = "Analyzing...";
  const fd = new FormData(); fd.append("file", chosen);
  try {
    const r = await fetch("/predict", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "Something went wrong");
    show(d);
  } catch (err) { alert(err.message); }
  btn.textContent = "Analyze Image"; btn.disabled = false;
};

function show(d) {
  const pct = (d.confidence * 100).toFixed(1);
  document.getElementById("label").textContent = d.label;
  document.getElementById("conf").textContent = "Confidence: " + pct + "%";
  document.getElementById("warn").textContent =
    d.confidence < 0.5 ? " Low confidence, the result is uncertain" : "";
  document.getElementById("bars").innerHTML = d.all.map(x =>
    `<div class="row"><span class="name">${x.label}</span>
     <div class="bar"><div style="width:${x.prob*100}%"></div></div>
     <span>${(x.prob*100).toFixed(1)}%</span></div>`).join("");
  result.style.display = "block";
}
</script>
</body>
</html>
